<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职进度看板</title>
<style>
  :root{--bg:#0f1117;--card:#181b25;--line:#262a38;--txt:#e6e9f0;--dim:#8a91a5;
    --c-to_apply:#8a91a5;--c-applied:#4f8ef7;--c-assessment:#b07df7;--c-interviewing:#f7a84f;
    --c-offer:#3ecf8e;--c-accepted:#2fae76;--c-rejected:#e05c6e;--c-dropped:#5a5f70;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:24px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:8px}
  h1{font-size:22px}
  .meta{color:var(--dim);font-size:12px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:88px}
  .stat b{font-size:20px;display:block}
  .stat span{color:var(--dim);font-size:12px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}
  .toolbar input{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;width:220px;outline:none}
  .chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--dim);user-select:none}
  .chip.on{color:var(--txt);border-color:currentColor}
  section{margin-bottom:26px}
  h2{font-size:14px;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  h2 .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .card h3{font-size:15px}
  .badge{font-size:11px;border-radius:6px;padding:1px 8px;white-space:nowrap}
  .sub{color:var(--dim);font-size:12px;margin:2px 0 8px}
  .next{font-size:13px;background:#20242f;border-left:3px solid var(--c-interviewing);padding:6px 10px;border-radius:0 6px 6px 0;margin-bottom:8px}
  .due{color:#f7a84f}
  details{font-size:12px;color:var(--dim)}
  details summary{cursor:pointer}
  details li{margin:2px 0 2px 16px}
  .empty{color:var(--dim);font-size:13px}
  footer{color:var(--dim);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<header>
  <h1 id="title">求职进度看板</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="stats" id="stats"></div>
<div class="toolbar" id="toolbar"><input id="search" placeholder="搜索公司 / 岗位 / 备注…"></div>
<main id="board"></main>
<footer>由 offer-board skill 生成 · 数据变更后重新渲染并 push 即自动更新</footer>
<script>
const DATA = __BOARD_DATA__;
const STATUS = [
  ["to_apply","待投递"],["applied","已投递"],["assessment","待测评/笔试"],
  ["interviewing","面试中"],["offer","有 Offer"],["accepted","已签约"],
  ["rejected","已拒"],["dropped","已放弃"]];
const hidden = new Set();
let query = "";

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function color(st){return `var(--c-${st})`}
function daysLeft(d){
  if(!d) return null;
  const n = Math.ceil((new Date(d+"T23:59:59") - new Date())/86400000);
  return n;
}
function match(a){
  if(!query) return true;
  const hay = [a.company,a.position,a.batch,a.channel,a.notes,a.next_action].join(" ").toLowerCase();
  return hay.includes(query);
}
function card(a){
  const dl = daysLeft(a.deadline);
  const dueTxt = dl===null?"":(dl<0?" 已逾期":` 剩 ${dl} 天`);
  const hist = (a.history||[]).slice(-6).reverse()
    .map(h=>`<li>${esc(h.date)} — ${esc(h.event)}</li>`).join("");
  return `<div class="card">
    <div class="top"><h3>${esc(a.company)} <span style="font-weight:400;color:var(--dim)">· ${esc(a.position)}</span></h3>
      <span class="badge" style="background:${color(a.status)}22;color:${color(a.status)}">${esc((a.round?a.round+" · ":"")+label(a.status))}</span></div>
    <div class="sub">${esc([a.batch,a.channel,a.applied_at&&("投递 "+a.applied_at)].filter(Boolean).join(" · "))}</div>
    ${a.next_action?`<div class="next">下一步：${esc(a.next_action)}${dl!==null?`<span class="due"> · ${esc(a.deadline)}${dueTxt}</span>`:""}</div>`:
      dl!==null?`<div class="next">截止：<span class="due">${esc(a.deadline)}${dueTxt}</span></div>`:""}
    ${a.url?`<div class="sub"><a href="${esc(a.url)}" style="color:var(--c-applied)">流程链接</a></div>`:""}
    ${a.notes?`<div class="sub">${esc(a.notes)}</div>`:""}
    ${hist?`<details><summary>最近动态</summary><ul>${hist}</ul></details>`:""}
  </div>`;
}
function label(st){return (STATUS.find(s=>s[0]===st)||[st,st])[1]}
function render(){
  const apps = DATA.applications||[];
  document.getElementById("title").textContent = (DATA.owner?DATA.owner+" · ":"")+(DATA.season||"求职进度看板");
  document.getElementById("meta").textContent = "更新于 "+(DATA.updated||"?");
  const counts = {};
  apps.forEach(a=>counts[a.status]=(counts[a.status]||0)+1);
  document.getElementById("stats").innerHTML = STATUS.filter(s=>counts[s[0]])
    .map(s=>`<div class="stat"><b style="color:${color(s[0])}">${counts[s[0]]}</b><span>${s[1]}</span></div>`).join("")
    +`<div class="stat"><b>${apps.length}</b><span>总记录</span></div>`;
  document.getElementById("toolbar").innerHTML =
    `<input id="search" placeholder="搜索公司 / 岗位 / 备注…" value="${esc(query)}">`+
    STATUS.map(s=>`<span class="chip ${hidden.has(s[0])?"":"on"}" data-s="${s[0]}" style="color:${color(s[0])}">${s[1]} ${counts[s[0]]||0}</span>`).join("");
  document.getElementById("search").oninput=e=>{query=e.target.value.toLowerCase();render()};
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const s=c.dataset.s; hidden.has(s)?hidden.delete(s):hidden.add(s); render();});
  document.getElementById("board").innerHTML = STATUS.filter(s=>!hidden.has(s[0])&&counts[s[0]]).map(s=>{
    const list = apps.filter(a=>a.status===s[0]&&match(a));
    return list.length?`<section><h2><span class="dot" style="background:${color(s[0])}"></span>${s[1]}（${list.length}）</h2>
      <div class="grid">${list.map(card).join("")}</div></section>`:
      `<section><h2><span class="dot" style="background:${color(s[0])}"></span>${s[1]}（0）</h2><div class="empty">暂无</div></section>`;
  }).join("")||`<div class="empty">没有匹配的投递记录</div>`;
}
render();
</script>
</body>
</html>
